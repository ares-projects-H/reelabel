name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  VERSION: "0.1.0"
  PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/build/pyinstaller-config
  APPIMAGETOOL_SHA256: "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2"

jobs:
  windows:
    name: Windows 10/11 x64 EXE
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/reelabel.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:REELABEL_SMOKE_TEST = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\Reelabel\Reelabel.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\Reelabel.iss"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: release/Reelabel-0.1.0-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/reelabel.spec

      - name: Smoke-test packaged application
        run: |
          REELABEL_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            "dist/Reelabel.app/Contents/MacOS/Reelabel"

      - name: Build DMG
        run: packaging/macos/build_dmg.sh "$VERSION" "${{ matrix.architecture }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.architecture }}
          path: release/Reelabel-0.1.0-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage and DEB
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/reelabel.spec

      - name: Smoke-test packaged directory
        run: |
          REELABEL_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            "dist/Reelabel/Reelabel"

      - name: Download AppImage tooling
        run: |
          curl -L --fail --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool-x86_64.AppImage" | sha256sum --check -
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

      - name: Build AppImage
        run: |
          packaging/linux/build_appimage.sh "$VERSION" "$PWD/squashfs-root/AppRun"

      - name: Build Ubuntu package
        run: packaging/linux/build_deb.sh "$VERSION"

      - name: Smoke-test AppImage
        run: |
          REELABEL_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            release/Reelabel-0.1.0-Linux-x86_64.AppImage \
            --appimage-extract-and-run

      - name: Install and smoke-test Ubuntu package
        run: |
          sudo apt-get install --yes \
            ./release/Reelabel-0.1.0-Ubuntu-24.04-x86_64.deb
          REELABEL_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen reelabel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64
          path: |
            release/Reelabel-0.1.0-Linux-x86_64.AppImage
            release/Reelabel-0.1.0-Ubuntu-24.04-x86_64.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "Reelabel $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
