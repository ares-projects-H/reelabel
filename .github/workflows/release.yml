name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: "0.1.0"
  PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/build/pyinstaller-config

jobs:
  windows:
    name: Windows 10/11 x64 EXE
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/media-renamer.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:MEDIA_RENAMER_SMOKE_TEST = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\Media Renamer\Media Renamer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\MediaRenamer.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/Media-Renamer-0.1.0-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/media-renamer.spec

      - name: Smoke-test packaged application
        run: |
          MEDIA_RENAMER_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            "dist/Media Renamer.app/Contents/MacOS/Media Renamer"

      - name: Build DMG
        run: packaging/macos/build_dmg.sh "$VERSION" "${{ matrix.architecture }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: release/Media-Renamer-0.1.0-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/media-renamer.spec

      - name: Smoke-test packaged directory
        run: |
          MEDIA_RENAMER_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            "dist/Media Renamer/Media Renamer"

      - name: Download AppImage tooling
        run: |
          curl -L --fail --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

      - name: Build AppImage
        run: |
          packaging/linux/build_appimage.sh "$VERSION" "$PWD/squashfs-root/AppRun"

      - name: Smoke-test AppImage
        run: |
          MEDIA_RENAMER_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen \
            release/Media-Renamer-0.1.0-Linux-x86_64.AppImage \
            --appimage-extract-and-run

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release/Media-Renamer-0.1.0-Linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "Media Renamer $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
