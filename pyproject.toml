[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reelabel"
version = "0.1.0"
description = "A safe, offline desktop app for previewing and renaming local media files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ares-projects-H" }]
keywords = ["media", "rename", "subtitles", "desktop", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["PySide6==6.11.1"]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-qt==4.5.0",
  "ruff==0.16.0",
]
build = [
  "pyinstaller==6.21.0",
  "pillow==12.3.0",
]

[project.scripts]
reelabel = "reelabel.cli:main"
reelabel-gui = "reelabel.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
